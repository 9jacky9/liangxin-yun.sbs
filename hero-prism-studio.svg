<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="100%" role="img" aria-label="良心云创客工坊棱镜分光与多端并肩协作动态图">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <linearGradient id="prismFaceA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="prismFaceB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="beamInput" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Studio Canvas Background -->
  <rect x="0" y="0" width="640" height="460" rx="18" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" />

  <!-- Subtle Swiss Grid Lines -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="0" y1="70" x2="640" y2="70" />
    <line x1="0" y1="160" x2="640" y2="160" />
    <line x1="0" y1="250" x2="640" y2="250" />
    <line x1="0" y1="340" x2="640" y2="340" />
    <line x1="140" y1="0" x2="140" y2="460" />
    <line x1="280" y1="0" x2="280" y2="460" />
    <line x1="420" y1="0" x2="420" y2="460" />
    <line x1="560" y1="0" x2="560" y2="460" />
  </g>

  <!-- Top Studio Header Bar -->
  <rect x="18" y="16" width="604" height="38" rx="10" fill="#0F172A" />
  <circle cx="38" cy="35" r="5" fill="#F97316" />
  <circle cx="54" cy="35" r="5" fill="#F59E0B" />
  <circle cx="70" cy="35" r="5" fill="#10B981" />
  <text x="94" y="40" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">LIANGXIN-YUN.SBS · 棱镜分光高并发协同引擎</text>
  <rect x="488" y="24" width="120" height="22" rx="11" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
  <circle cx="502" cy="35" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="514" y="39" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">BGP 专线同步中</text>

  <!-- Left Input High-Speed Trunk Beam -->
  <g>
    <rect x="26" y="198" width="90" height="64" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" />
    <text x="71" y="226" text-anchor="middle" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">创客本地端</text>
    <text x="71" y="244" text-anchor="middle" fill="#4F46E5" font-family="sans-serif" font-size="10" font-weight="700">IEPL 聚合入口</text>

    <!-- Trunk Light Beam into Central Prism -->
    <line x1="116" y1="230" x2="236" y2="230" stroke="url(#beamInput)" stroke-width="8" stroke-linecap="round" />
    <circle r="5" fill="#F97316">
      <animateMotion path="M 116 230 L 236 230" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#4F46E5">
      <animateMotion path="M 116 230 L 236 230" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Split Refracted Light Streams (4 Colored Paths to Global Creative Studios) -->
  <g fill="none" stroke-linecap="round">
    <!-- Stream 1: Coral (AI Models & API) -->
    <path id="streamCoral" d="M 300 205 C 355 145, 395 108, 456 108" stroke="#F97316" stroke-width="4" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.1s" repeatCount="indefinite" />
    </path>
    <!-- Stream 2: Indigo (Git LFS & Code Co-Creation) -->
    <path id="streamIndigo" d="M 312 222 C 365 190, 405 186, 456 186" stroke="#4F46E5" stroke-width="4" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite" />
    </path>
    <!-- Stream 3: Emerald (4K / 8K Raw Video Stream) -->
    <path id="streamEmerald" d="M 312 242 C 365 265, 405 268, 456 268" stroke="#10B981" stroke-width="4" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.0s" repeatCount="indefinite" />
    </path>
    <!-- Stream 4: Amber (Cloud Design & Real-time Whiteboard) -->
    <path id="streamAmber" d="M 300 258 C 355 315, 395 348, 456 348" stroke="#F59E0B" stroke-width="4" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.3s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Moving Photon Packets along the 4 Refracted Streams -->
  <circle r="5" fill="#F97316">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 300 205 C 355 145, 395 108, 456 108" />
  </circle>
  <circle r="5" fill="#4F46E5">
    <animateMotion dur="1.3s" repeatCount="indefinite" path="M 312 222 C 365 190, 405 186, 456 186" />
  </circle>
  <circle r="5" fill="#10B981">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 312 242 C 365 265, 405 268, 456 268" />
  </circle>
  <circle r="5" fill="#F59E0B">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 300 258 C 355 315, 395 348, 456 348" />
  </circle>

  <!-- Central Optical Prism Hub ("良心云 SBS Prism Core") -->
  <g transform="translate(270, 230)">
    <!-- Pulsing Outer Sync Rings -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-opacity="0.35">
      <animate attributeName="r" values="48;68;48" dur="3s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

    <!-- Rotating Geometric Ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" />
      <polygon points="0,-38 33,19 -33,19" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4 4" />
    </g>

    <!-- Twin Interlocking Prism Triangles (Side-by-Side Core) -->
    <polygon points="-22,20 0,-26 8,20" fill="url(#prismFaceA)" />
    <polygon points="-4,20 10,-18 26,20" fill="url(#prismFaceB)" opacity="0.92" />
    <text x="0" y="35" text-anchor="middle" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="800">良心云核心</text>
  </g>

  <!-- Right Side: 4 Synchronized Studio Cards -->
  <!-- Card 1: AI Workflow -->
  <g transform="translate(456, 78)">
    <rect x="0" y="0" width="158" height="58" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="2" />
    <rect x="10" y="12" width="8" height="34" rx="4" fill="#F97316" />
    <text x="26" y="27" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">AI 推理与大模型</text>
    <text x="26" y="44" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="600">API 零丢包 · 18ms</text>
  </g>

  <!-- Card 2: Code & Git LFS -->
  <g transform="translate(456, 156)">
    <rect x="0" y="0" width="158" height="58" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" />
    <rect x="10" y="12" width="8" height="34" rx="4" fill="#4F46E5" />
    <text x="26" y="27" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">Git LFS 资产同步</text>
    <text x="26" y="44" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="600">满速拉取 · 2.5Gbps</text>
  </g>

  <!-- Card 3: 4K Media -->
  <g transform="translate(456, 238)">
    <rect x="0" y="0" width="158" height="58" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2" />
    <rect x="10" y="12" width="8" height="34" rx="4" fill="#10B981" />
    <text x="26" y="27" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">4K 原画流媒体直连</text>
    <text x="26" y="44" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="600">原生解锁 · 极速秒开</text>
  </g>

  <!-- Card 4: Multi-Device Co-Creation -->
  <g transform="translate(456, 318)">
    <rect x="0" y="0" width="158" height="58" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" />
    <rect x="10" y="12" width="8" height="34" rx="4" fill="#F59E0B" />
    <text x="26" y="27" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">跨国白板实时协作</text>
    <text x="26" y="44" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="600">多端并肩 · 零延迟感</text>
  </g>

  <!-- Animated Collaborative Studio Cursors -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="170,115; 210,135; 170,115" dur="4s" repeatCount="indefinite" />
    <polygon points="0,0 0,16 5,12 11,14" fill="#F97316" />
    <rect x="12" y="10" width="58" height="18" rx="9" fill="#F97316" />
    <text x="41" y="22" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700">设计师 A</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="160,330; 205,305; 160,330" dur="4.5s" repeatCount="indefinite" />
    <polygon points="0,0 0,16 5,12 11,14" fill="#4F46E5" />
    <rect x="12" y="10" width="58" height="18" rx="9" fill="#4F46E5" />
    <text x="41" y="22" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700">开发者 B</text>
  </g>

  <!-- Bottom Status Strip -->
  <rect x="18" y="400" width="604" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="36" y="425" fill="#334155" font-family="sans-serif" font-size="11" font-weight="700">并肩协作通道：亚太 / 北美 / 欧洲 36+ 创客专线节点全天候智能分流</text>
  <text x="602" y="425" text-anchor="end" fill="#4F46E5" font-family="sans-serif" font-size="11" font-weight="800">可用率 99.98%</text>
</svg>
